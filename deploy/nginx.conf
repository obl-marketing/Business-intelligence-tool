# nginx reverse proxy for STARS.
# Put this at /etc/nginx/sites-available/stars, then symlink into sites-enabled.
# Replace stars.yourcompany.com with your real domain.
#
# HTTPS is added automatically by:  sudo certbot --nginx -d stars.yourcompany.com
# (certbot rewrites this file to add the ssl block + redirect).

server {
    listen 80;
    server_name stars.yourcompany.com;

    # Streamlit needs websocket upgrade headers to work through a proxy.
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;   # keep long-lived websocket alive
    }
}
