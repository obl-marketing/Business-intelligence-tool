name: Deploy STARS to server

# Push to the branch -> the Ubuntu server pulls and restarts automatically.
on:
  push:
    branches:
      - claude/relaxed-volta-hvi2d   # change to 'main' once you merge there

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}       # server IP or hostname
          username: ${{ secrets.DEPLOY_USER }}   # e.g. stars
          key: ${{ secrets.DEPLOY_SSH_KEY }}     # private key (see SETUP)
          port: ${{ secrets.DEPLOY_PORT }}       # usually 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}        # e.g. /opt/stars
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            ./.venv/bin/pip install -q -r requirements.txt
            sudo systemctl restart stars
            echo "Deployed $(git rev-parse --short HEAD)"
