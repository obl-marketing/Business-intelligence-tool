name: Deploy STARS to Windows server

# Push to the branch -> the Windows server pulls and restarts automatically.
on:
  push:
    branches:
      - claude/relaxed-volta-hvi2d   # change to 'main' once you merge there

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (Windows / OpenSSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}       # server IP or hostname
          username: ${{ secrets.DEPLOY_USER }}   # a Windows admin user
          key: ${{ secrets.DEPLOY_SSH_KEY }}     # private key (see SETUP)
          port: ${{ secrets.DEPLOY_PORT }}       # usually 22
          # Runs the update script already on the server. Requires the OpenSSH
          # default shell to be PowerShell (SETUP step W6) OR this cmd form works
          # from the default cmd shell too:
          script: powershell -ExecutionPolicy Bypass -File C:\stars\deploy\update.ps1
